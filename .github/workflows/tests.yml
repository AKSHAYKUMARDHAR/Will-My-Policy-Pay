name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Insurer sites sometimes block cloud runners; tests that need the PDFs skip without them.
      - name: Fetch the policy PDFs (best effort)
        run: python -m scripts.fetch_documents || true
        timeout-minutes: 5
        continue-on-error: true
        env:
          FETCH_TIMEOUT: "20"
      - run: python -m pytest -q
