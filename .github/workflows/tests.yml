name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Insurer sites sometimes block cloud runners; tests that need the PDFs skip without them.
      - run: python -m scripts.fetch_documents || true
      - run: python -m pytest -q
